// game mode shortcuts (menu New Game forces maxplayers 1, so use these instead)
alias singleplayer "maxplayers 16; deathmatch 0; coop 1; timelimit 0; scratch1 0; map start"
alias multiplayer "maxplayers 16; deathmatch 1; coop 0; fraglimit 50; map dm4"

// for testing
set scarlet_testing 0

// singleplayer and coop only (do nothing in deathmatch)
set scarlet_singleplayer_monsters_density_easy 1 // SP/co-op only: monster count per difficulty, 1=as the map was built, below 1 removes some, above 1 adds extras (set before the map loads)
set scarlet_singleplayer_monsters_density_normal 1
set scarlet_singleplayer_monsters_density_hard 1
set scarlet_singleplayer_monsters_density_nightmare 1
set scarlet_singleplayer_monsters_drop_chance 0 // SP/co-op only: chance a monster killed by a player drops a random powerup (Megahealth, Quad or Pent), 0=never
set scarlet_singleplayer_monsters_speed_easy 1 // SP/co-op only: monsters chase a player they can see this many times faster, per difficulty (1=stock)
set scarlet_singleplayer_monsters_speed_normal 1
set scarlet_singleplayer_monsters_speed_hard 1
set scarlet_singleplayer_monsters_speed_nightmare 1
set scarlet_singleplayer_monsters_damage_easy 1 // SP/co-op only: monsters hit players this many times harder, per difficulty (1=stock)
set scarlet_singleplayer_monsters_damage_normal 1
set scarlet_singleplayer_monsters_damage_hard 1
set scarlet_singleplayer_monsters_damage_nightmare 1
set scarlet_singleplayer_monsters_health_easy 1 // SP/co-op only: monsters have this many times the health
set scarlet_singleplayer_monsters_health_normal 1
set scarlet_singleplayer_monsters_health_hard 1
set scarlet_singleplayer_monsters_health_nightmare 1
set scarlet_singleplayer_zombies_killable 0 // SP/co-op only: 1 means zombies die from ordinary damage (it adds up) and stay dead, instead of only exploding
set scarlet_singleplayer_keep_progress 0 // SP only (co-op never restarts): 1 means dying never restarts the level, you respawn at the start and the monsters you killed stay dead
set scarlet_singleplayer_bots_range 1000 // SP/co-op only: bots only go after monsters and items within this many units of a player (0=no limit)
set scarlet_singleplayer_bots_follow_distance 128 // SP/co-op only: bots following a player stop this many units away (128 is stock), and back off if closer than 3/8 of it
set scarlet_singleplayer_bots_regroup_distance 1500 // SP/co-op only: bots that fall this far behind every player (and are out of sight) teleport to the nearest one, 0=off

// off allows bots to pick unique tops in teamplay
set scarlet_bots_enemy_color -1 // color the opposing bot team always wears (0-13 like the color command, 4=red, -1=random)
set scarlet_bots_team_jersey 1

// control chat spam
set scarlet_chat_guns 1
set scarlet_chat_ammo 1
set scarlet_chat_armor 1
set scarlet_chat_health 1
set scarlet_chat_backpacks 1
set scarlet_chat_deaths 1 // 2 uses alternate death notices
set scarlet_chat_killstreak_achieve 1 // the center-screen "Killing Spree!" for the player who reached a new tier
set scarlet_chat_killstreaks 1
set scarlet_chat_powerups 1 // the "You got the Quad Damage" and wearing-off messages

// shuffle music each map from music/trackNN.ogg|mp3 (0 = use the map's own track)
set scarlet_music 0
set scarlet_music_min 2
set scarlet_music_max 11

// credit assists to players who damaged the victim this many seconds before the kill (0=off)
set scarlet_assist_window 0
// the HUD mod draws a marker over teammates, visible through walls (teamplay only)
set scarlet_team_markers 0
set scarlet_team_marker_scale 1 // size of the teammate marker and name (1=normal, 2=double)
set scarlet_team_marker_names 1 // show the teammate's name over the marker (0=marker only)

// turn on footsteps
set scarlet_footsteps 0

// turn on random bot chat
set scarlet_bot_dialogue 1
set scarlet_bot_autofill 0 // 1 = fill deathmatch games with bots to suit the map's size (not in single player or co-op)
set scarlet_bot_autofill_units 500000 // floor area (square units, measured by trailgen) for each player: a bigger number means fewer players
set scarlet_bot_autofill_min 4 // least players (people and bots) wanted
set scarlet_bot_autofill_max 12 // most players wanted
set scarlet_bot_autofill_delay 8 // seconds between one bot joining and the next (random between half and one and a half times this)
set scarlet_bot_dialogue_gap 12 // the least seconds between two bot chat lines, whoever says them
set scarlet_bot_dialogue_gap_random 8 // up to this many more seconds, picked at random, are added to that
set scarlet_bot_dialogue_odds_connect 0.6 // the chance (0 to 1) a bot says something when it joins
set scarlet_bot_dialogue_odds_welcome 0.6 // a bot greets the one who joined
set scarlet_bot_dialogue_odds_victory 0.3 // a bot gloats after its frags go up (only when it is winning)
set scarlet_bot_dialogue_odds_deathsdoor 0.3 // a bot is under 20 health in a fight (only when it is not winning)
set scarlet_bot_dialogue_odds_death 0.3 // a bot is killed by a player (only when it is not winning)
set scarlet_bot_dialogue_odds_team 0.3 // a bot talks to its team (only when it is not winning)
set scarlet_bot_dialogue_odds_suicide 0.6 // a bot kills itself
set scarlet_bot_dialogue_odds_ridicule 0.6 // another bot mocks the one that killed itself
set scarlet_bot_dialogue_odds_intermission 0.3 // a bot comments when the level ends

// items respawn in single player and coop (0 = as in Quake)
set scarlet_singleplayer_resupply 0

// seconds until a dead player respawns by itself (0 = wait for a button press, as in Quake)
set scarlet_respawn 0
set scarlet_respawn_invul 0 // seconds of damage immunity after a respawn (0 = off)

// show names when aiming
set scarlet_nametags 0

// weapon drops outside backpack
set scarlet_visible_weapons 0

// remove shotgun and nailgun
set scarlet_remove_weaker_weapons 0

// custom loadouts
set weapons 0

// the dead
set scarlet_dead_noclip 0 // 1 lets you walk through monsters and players the moment they die

// heads can be kicked
set scarlet_football 0

// transparent item placeholders
set scarlet_item_ghosts 0

// autoswitch
set scarlet_autoswitch 1
set scarlet_armor_always_take 0 // 1 picks up an armor box of the same color as the armor you wear even when yours is as good or better (the box is used up, yours stays the same); a box of another color that is no better is still left alone

// killsteaks
set scarlet_killstreak_vfx 0 // 1 = the killstreak visual effects (the skulls, the blood swirl, the HUD label and dots) are on, 0 = off; streaks are still counted, announced in chat, on the scoreboard and healing
set scarlet_killstreak_vfx_skulls 0 // 1 = zombie heads orbit a player's feet, one more for every 5 kills in a row (they go when the streak ends)
set scarlet_killstreak_vfx_skulls_max 8 // most skulls a player can have
set scarlet_killstreak_vfx_skulls_radius 40 // how far from the player the skulls orbit, in units
set scarlet_killstreak_vfx_skulls_height 12 // how high above the floor under the player the skulls orbit, in units
set scarlet_killstreak_vfx_skulls_speed 150 // how fast the skulls spin around the player, in degrees a second (360 is a turn a second, negative spins the other way)
set scarlet_killstreak_vfx_skulls_pitch -90 // tips the skulls so they face out; if they face in, try 90, up or down is 0 or 180
set scarlet_killstreak_vfx_skulls_blood 1 // how much the skulls bleed: 0 = not at all, 1 = a steady drip, 2 = twice that, and so on (each puff is a particle message ten or more times a second)
set scarlet_killstreak_heal 0 // health healed once a second for every skull (5 kills in a row) earned, up to scarlet_killstreak_vfx_skulls_max skulls; it heals in the middle of a fight too, 0 = off
set scarlet_killstreak_vfx_swirl 0 // 1 = a swirl of red blood particles circles the feet of a player on a streak (5+ kills), thicker and wider as the streak grows
set scarlet_killstreak_vfx_swirl_style 1 // 0 = a swirl that gets thicker with the streak, 1 = waves of blood pulsing outward from the player, quicker with the streak, 2 = a spiral of blood climbing the player, more strands with the streak, 3 = a flat disc-shaped spiral at the player's feet, quiet
set scarlet_killstreak_vfx_swirl_radius 24 // how far from the player the swirl starts, in units (it widens a little with the streak)
set scarlet_killstreak_vfx_swirl_speed 360 // how fast the swirl turns, in degrees a second

// allow melee
set scarlet_melee 0
set scarlet_melee_spam 2
set scarlet_melee_lunge 0 // 1 enables the alt axe attack lunge (the settings below tune it)
set scarlet_melee_lunge_speed 0 // forward speed of the alt axe lunge (0=no lunge, 250-500 is a good range)
set scarlet_melee_lunge_hop 0 // upward speed added when lunging from the ground (60 is a small hop)
set scarlet_melee_lunge_range 0 // lunge only when a player or monster is this close in front of you (0=off, 250 is good)
set scarlet_melee_lunge_always 0 // 1 lunges on every alt axe attack, even with nobody in front of you
set scarlet_melee_lunge_cooldown 10 // seconds before the lunge can be used again (0=no limit)

// allow hand grenades
set scarlet_grenades 0
set scarlet_grenades_min 2
set scarlet_grenades_max 4
set scarlet_grenades_fuse 1.5
set scarlet_grenades_touch 0
set scarlet_grenades_chance .5
set scarlet_grenades_maxpack 2
set scarlet_grenades_cooldown 8
set scarlet_grenades_restock 0
set scarlet_rof_hg .6

// gore settings
set scarlet_gore 0
set scarlet_gore_chance_per_hit 0
set scarlet_gore_chance_per_drop 1
set scarlet_gore_chance_bullets .3
set scarlet_gore_multiplier_bullets 1
set scarlet_gore_chance_nails .6
set scarlet_gore_multiplier_nails 1
set scarlet_gore_chance_rockets .8
set scarlet_gore_multiplier_rockets 12
set scarlet_gore_chance_cells .6
set scarlet_gore_multiplier_cells 8

// weapon damage values
set scarlet_dmg_axe 20
set scarlet_dmg_bullets 4
set scarlet_bullets_in_shell_sg 6; // how many bullets are in a shell fired from a shotgun?
set scarlet_bullets_in_shell_ssg 14; // how many bullets are in 2 shells fired from a super shotgun?
set scarlet_dmg_nails 9
set scarlet_dmg_rockets 120
set scarlet_dmg_cells 30

// weapon ammo consumption
set scarlet_ammo_dec_shells 1
set scarlet_ammo_dec_nails 1
set scarlet_ammo_dec_rockets 1
set scarlet_ammo_dec_cells 1

// weapon ammo maximums
set scarlet_ammo_max_shells 100
set scarlet_ammo_max_nails 200
set scarlet_ammo_max_rockets 100
set scarlet_ammo_max_cells 100

// weapon rate of fire
set scarlet_rof_axe 0.5
set scarlet_axe_frametime 0.4 // seconds the whole axe swing takes (four frames), 0.4 is id's, 0.2 is a faster swing (the damage frame comes sooner)
set scarlet_rof_sg .5
set scarlet_rof_ssg .7
set scarlet_rof_ng 0.2
set scarlet_rof_sng 0.2
set scarlet_rof_rl .8
set scarlet_rof_gl .6
set scarlet_rof_tb 0
set scarlet_weapon_range_tb 600 // Thunderbolt beam reach in units (0 = as far as the map goes, still stopped by walls)

// weapon spread
set scarlet_aim_assist 0 // 0 = off, else the degrees off the crosshair within which a Thunderbolt beam (the only weapon with aim assist) is pulled onto a player or monster (2 is about one player width at 1000 units)
set scarlet_aim_assist_growth 0 // extra aim assist degrees for every 1000 units of distance (0 = the cone is the same at any distance)
set scarlet_aim_assist_max 0 // the widest the aim assist cone can grow, in degrees (0 = no limit)
set scarlet_spr_sg 4
set scarlet_spr_ssg 14
set scarlet_spr_ng 0
set scarlet_spr_sng 0

// weapon kick
set scarlet_weapon_kick_sg 2
set scarlet_weapon_kick_ssg 4
set scarlet_weapon_kick_ng 2
set scarlet_weapon_kick_sng 2
set scarlet_weapon_kick_gl 2
set scarlet_weapon_kick_rl 2
set scarlet_weapon_kick_tb 2

// weapon speed
set scarlet_ammo_spd_ng 1000 // anything over 2k becomes hitscan
set scarlet_ammo_spd_sng 1000 // anything over 2k becomes hitscan

// armor absorb (the share of each hit the armor takes; green, yellow and red armor hold 100, 150 and 200)
set scarlet_absorb_green 0.3
set scarlet_absorb_yellow 0.6
set scarlet_absorb_red 0.8

// ammo crates
set scarlet_ammobox_shells_big 40
set scarlet_ammobox_shells_small 20
set scarlet_ammobox_nails_big 50
set scarlet_ammobox_nails_small 25
set scarlet_ammobox_rockets_big 10
set scarlet_ammobox_rockets_small 5
set scarlet_ammobox_cells_big 12
set scarlet_ammobox_cells_small 6
set scarlet_weapon_ammo 0 // 1 = a picked up weapon brings a small ammo box worth of ammo

// rewards
set scarlet_rewards 0
set scarlet_rewards_drop_chance .07 // chance a kill drops a powerup (0-1)
set scarlet_rewards_drop_streak .05 // extra chance for every kill in the dead player's killstreak
set scarlet_rewards_expire 30

// recharge settings
set scarlet_recharge 0
set scarlet_recharge_cooldown 5
set scarlet_recharge_health 0
set scarlet_recharge_armor 10

// custom bot priorities
set scarlet_bot_priority_quad 1000
set scarlet_bot_priority_pent 1000
set scarlet_bot_priority_ring 0
set scarlet_bot_priority_mega 1000
set scarlet_bot_priority_armor 1500 // how badly a bot wants armor that is better than what it wears, or any armor at all (100 and up is a vital item worth the trip from anywhere; above the powerups, a bot goes for armor first)

set scarlet_bot_flee 1 // 1 = bots run away from a player holding the Pentagram, and from one holding the Quad if they have no powerup of their own, 0 = they never run
set scarlet_bot_edgefriction 1.5 // extra friction bots feel at a dropoff edge (1=none so they can fall, 2=stock Frikbot, they brake hard)
set scarlet_bot_handicap 1 // how much weaker bots below skill 3 are: slower to react, turn slower, miss more, dodge less (1=full, 0=all bots play like skill 3)
set scarlet_bot_goal_distance 1500 // how far away an item is worth half as much to a bot, so it prefers what is close (0=distance doesn't matter, it goes for the best item anywhere; powerups are always worth the trip)
set scarlet_dev_rechargelog 0 // dev: 1 prints each health/armor recharge, with the time, in your console
set scarlet_dev_botfreeze 0 // dev: 1 makes every bot stand still
set scarlet_dev_botskulls 0 // dev: a number above 0 puts every player and bot at that killstreak tier (1 per 5 kills) for the skulls, the blood swirl and your HUD
set scarlet_dev_autobots 0 // dev: add this many bots by itself a moment after the map starts, so a dedicated server can test bots with nobody connected
set scarlet_dev_wayfile 0 // dev: 1 also loads the old maps/<map>.way waypoint file, only to compare it against a trail
set scarlet_dev_botlog 0 // dev: 1 prints each bot's position and goal once a second, and every goal it reaches or gives up on (needs developer 1)
set scarlet_dev_botgoal 0 // dev: 1 floats a model over each bot showing its goal (the item's own model, a fireball for a waypoint, a rocket when fighting, a gib when running from a pentagram), and looking at a bot prints its goal

// powerup icons overhead
set scarlet_powerup_icons 0 // float a miniature quad/pent above players carrying one (needs engine support for the scale field)
set scarlet_powerup_icon_scale 0.4 // size of the floating icon
set scarlet_powerup_icon_height 42 // how far above the player's origin the icon floats (the head top is about 32)
